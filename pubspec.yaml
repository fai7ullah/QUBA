name: quba
description: "QUBA — Quran, prayer times and Athan. Offline-first Islamic companion."
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  shared_preferences: ^2.5.3
  just_audio: ^0.10.5
  share_plus: ^13.3.1
  in_app_review: ^2.0.9
  http: ^1.5.0
  path_provider: ^2.1.5
  scrollable_positioned_list: ^0.3.8
  flutter_compass: ^0.8.1
  home_widget: ^0.10.0
  file_picker: ^13.4.0
  app_settings: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quran/quran_bundle.json
    - assets/quran/quran_meta.json
    - assets/quran/quran_indopak.json
    - assets/quran/quran_indopak_pages.json
    - assets/quran/trans_ur_jalandhry.json
    - assets/quran/trans_fa_ghomshei.json
    - assets/quran/trans_en_yusufali.json
    - assets/hadith/bukhari.json
    - assets/hadith/muslim.json
    - assets/hadith/abudawud.json
    - assets/hadith/tirmidhi.json
    - assets/hadith/nasai.json
    - assets/hadith/ibnmajah.json
    - assets/tafsir/jalalayn.json
    - assets/fonts/OFL-ScheherazadeNew.txt
    - assets/images/mosque_arch.webp
    - assets/images/quran_rehal.webp
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: IndoPakQuran
      fonts:
        - asset: assets/fonts/IndoPakQuran-Regular.ttf

# Launcher icon: Umar's official QUBA logo (assets/images/quba_logo.png).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/quba_logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8F0E5"
  adaptive_icon_foreground: "assets/images/quba_logo_icon.png"
