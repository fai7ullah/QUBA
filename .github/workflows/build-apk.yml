# Builds a debug APK of QUBA on every push to main (and on manual runs),
# then publishes it as a GitHub Release so it can be downloaded directly.
name: Build QUBA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable channel)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse code
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUBA-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            --title "QUBA test build ${{ github.run_number }}" \
            --notes "Debug APK built automatically from the main branch." \
            build/app/outputs/flutter-apk/app-debug.apk
